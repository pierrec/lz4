name: ci
on:
  push:
    branches:
      - "v4"
  pull_request:
    branches:
      - "v4"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26", "1.27"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: test
        run: |
          go test ./... -v
          go test ./... -v -race
          go test ./... -v -tags noasm
          go test ./... -v -race -tags noasm
  silesia:
    # Round-trip and decoder tests on the Silesia corpus (testdata/silesia.tar,
    # as in klauspost/compress), on both assembly decoders. The corpus is
    # fetched once and cached; the key is its pinned SHA-256.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: cache Silesia
        id: cache
        uses: actions/cache@v4
        with:
          path: testdata/silesia.tar
          key: silesia-tar-6e2bc2220fa51f7027518432c7fd01fe3ba830f69ffd8c89622ab073d474cf29
      - name: fetch Silesia
        # On a cache hit this only verifies the cached file.
        run: testdata/fetch_silesia.sh
      - name: C-CLI frames
        run: |
          sudo apt-get install -y -qq lz4
          lz4 -q -f -BD -B4 testdata/silesia.tar testdata/silesia.tar.B4D.lz4
          lz4 -q -f -BD -B7 testdata/silesia.tar testdata/silesia.tar.B7D.lz4
      - name: test
        run: |
          go test -run Silesia -v . ./internal/lz4block
          go test -run Silesia -v -tags noasm . ./internal/lz4block
  fuzz:
    # A short smoke test of each fuzzer; run them for longer locally, see fuzz/README.md.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: fuzz
        run: |
          go test -run '^$' -fuzz '^FuzzBlockRoundTrip$' -fuzztime 24s ./internal/lz4block
          go test -run '^$' -fuzz '^FuzzDecodeBlockDifferential$' -fuzztime 24s ./internal/lz4block
          go test -run '^$' -fuzz '^FuzzCompressBlockDst$' -fuzztime 24s ./internal/lz4block
          go test -run '^$' -fuzz '^FuzzReader$' -fuzztime 24s .
          go test -run '^$' -fuzz '^FuzzFrameRoundTrip$' -fuzztime 24s .
      - name: upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.os }}
          path: |
            testdata/fuzz
            internal/lz4block/testdata/fuzz
